<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>{{ config.site_title }} - Login</title>
<link rel="icon" href="{{ config.icon_url }}">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
:root{
  --green:#63ff00;
  --green2:#32d900;
  --dark:#050805;
  --panel:rgba(6,9,6,.90);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:"Courier New",monospace;background:#020302;color:#fff;overflow:hidden}
body{min-height:100vh;display:flex;align-items:center;justify-content:flex-start;padding:24px 0 24px 5vw;position:relative}
#tech-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:
 radial-gradient(circle at 50% 45%,rgba(74,255,0,.08),transparent 28%),
 radial-gradient(circle at 50% 100%,rgba(74,255,0,.05),transparent 45%),#020302}
#tech-bg:before{
 content:"";position:absolute;inset:-10%;
 background-image:
  linear-gradient(90deg,transparent 49.5%,rgba(99,255,0,.07) 50%,transparent 50.5%),
  linear-gradient(0deg,transparent 49.5%,rgba(99,255,0,.05) 50%,transparent 50.5%);
 background-size:80px 80px;transform:perspective(500px) rotateX(55deg) scale(1.4);
 opacity:.22;animation:gridMove 12s linear infinite;
}
@keyframes gridMove{to{background-position:0 80px,80px 0}}
.node{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);opacity:.7;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translate(20px,-25px);opacity:.2}}
.circuit{position:absolute;opacity:.22;border:1px solid var(--green);box-shadow:0 0 8px rgba(99,255,0,.25)}
.circuit.a{width:180px;height:180px;left:-50px;top:12%;border-radius:40%}
.circuit.b{width:220px;height:220px;right:-80px;bottom:8%;border-radius:50%}
.circuit:after{content:"";position:absolute;width:70px;height:1px;background:var(--green);top:50%;left:100%}
.scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:.12;animation:scan 5s linear infinite}
@keyframes scan{from{top:-5%}to{top:105%}}

.login-card{
 width:min(390px,42vw);min-height:560px;padding:30px 34px 26px;
 position:relative;z-index:2;border:2px solid rgba(99,255,0,.9);
 border-radius:30px;background:linear-gradient(145deg,rgba(10,14,10,.96),rgba(2,4,2,.92));
 box-shadow:0 0 20px rgba(99,255,0,.55),0 0 75px rgba(99,255,0,.18),inset 0 0 55px rgba(99,255,0,.035);
 overflow:hidden;
}
.login-card:before{content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;
 background:linear-gradient(120deg,rgba(99,255,0,.08),transparent 28%,transparent 70%,rgba(99,255,0,.04));
}
.brand{text-align:center;position:relative;z-index:1}
.shield{
 width:76px;height:76px;margin:0 auto 22px;display:grid;place-items:center;
 color:var(--green);filter:drop-shadow(0 0 12px rgba(99,255,0,.7));
}
.shield svg{width:100%;height:100%}
.brand h1{margin:0;font-family:Arial,sans-serif;font-size:clamp(25px,3.5vw,38px);font-weight:800;letter-spacing:2px;color:#f4f4f4;line-height:.98}
.brand h1 span{color:var(--green);text-shadow:0 0 15px rgba(99,255,0,.4)}
.brand .vps{color:#f4f4f4}
.subtitle{margin:16px auto 28px;display:flex;align-items:center;gap:18px;justify-content:center;color:var(--green);font-size:15px;letter-spacing:5px}
.subtitle:before,.subtitle:after{content:"";height:1px;width:85px;background:linear-gradient(90deg,transparent,var(--green))}
.subtitle:after{background:linear-gradient(90deg,var(--green),transparent)}

.terminal-line{display:flex;align-items:center;gap:10px;color:#f5f5f5;font-size:14px;margin-bottom:20px;letter-spacing:1px}
.prompt{color:var(--green);font-size:23px}
.cursor{width:12px;height:26px;background:var(--green);display:inline-block;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.password-wrap{position:relative;margin-bottom:28px}
.password-wrap:before{content:"";position:absolute;left:24px;top:50%;width:22px;height:22px;transform:translateY(-50%);border:2px solid var(--green);border-radius:5px;opacity:.95}
.login-input{
 width:100%;height:58px;padding:0 70px 0 80px;border-radius:16px;border:2px solid rgba(99,255,0,.65);
 background:rgba(0,0,0,.38);color:#fff;font:16px "Courier New",monospace;outline:none;
 box-shadow:inset 0 0 20px rgba(99,255,0,.025);transition:.25s;
}
.login-input::placeholder{color:#777;letter-spacing:2px}
.login-input:focus{border-color:var(--green);box-shadow:0 0 22px rgba(99,255,0,.22),inset 0 0 20px rgba(99,255,0,.04)}
.toggle-password{position:absolute;right:25px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--green);cursor:pointer}

.login-button{
 width:100%;height:64px;border:2px solid var(--green);border-radius:12px;cursor:pointer;
 background:linear-gradient(180deg,#78ff18,#47e800);color:#061000;
 font:700 16px "Courier New",monospace;letter-spacing:5px;
 box-shadow:0 0 25px rgba(99,255,0,.48),inset 0 1px rgba(255,255,255,.45);
 transition:.2s;position:relative;overflow:hidden;
}
.login-button:before{content:"";position:absolute;inset:4px;border:1px solid rgba(0,0,0,.25);border-radius:8px}
.login-button:hover{transform:translateY(-2px);box-shadow:0 0 38px rgba(99,255,0,.7)}
.login-button:active{transform:translateY(0)}
.login-button i{margin-right:14px}
.error-message{margin:-10px 0 20px;padding:12px;border:1px solid #ff3d3d;color:#ff6b6b;background:rgba(255,0,0,.08);border-radius:8px;text-align:center;font-size:13px}

.lock-line{display:flex;align-items:center;gap:18px;margin:22px 0 14px;color:var(--green)}
.lock-line:before,.lock-line:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--green))}
.lock-icon{width:40px;height:40px;border:2px solid var(--green);clip-path:polygon(50% 0,90% 25%,90% 75%,50% 100%,10% 75%,10% 25%);display:grid;place-items:center;filter:drop-shadow(0 0 7px rgba(99,255,0,.35))}
.warning{text-align:center;color:#b8b8b8;font:14px Arial,sans-serif;letter-spacing:2px;line-height:1.7}
.warning i{color:var(--green);margin-right:10px}
.credit{text-align:center;margin-top:20px;color:var(--green);font-size:13px;letter-spacing:5px;line-height:1.8}
.credit strong{display:block;font-size:15px;letter-spacing:4px;margin-top:5px}


/* Animated black-hole / galaxy ambience */
.galaxy{position:fixed;right:7vw;top:50%;transform:translateY(-50%);width:min(520px,48vw);height:min(520px,48vw);border-radius:50%;pointer-events:none;z-index:1;filter:drop-shadow(0 0 35px rgba(99,255,0,.16));}
.galaxy .halo{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,#000 0 20%,transparent 21%),conic-gradient(from 20deg,transparent 0 12%,rgba(99,255,0,.75),transparent 25% 38%,rgba(90,255,30,.35),transparent 52% 68%,rgba(99,255,0,.65),transparent 82%);filter:blur(2px);animation:spinGalaxy 9s linear infinite;transform:rotateX(68deg);}
.galaxy .ring{position:absolute;inset:16%;border:12px solid rgba(99,255,0,.18);border-left-color:rgba(99,255,0,.75);border-right-color:rgba(99,255,0,.45);border-radius:50%;transform:rotateX(68deg) rotateZ(-18deg);box-shadow:0 0 25px rgba(99,255,0,.28);animation:ringPulse 3s ease-in-out infinite;}
.galaxy .core{position:absolute;left:50%;top:50%;width:27%;height:27%;transform:translate(-50%,-50%);border-radius:50%;background:#000;box-shadow:0 0 30px 12px rgba(0,0,0,.95),0 0 80px 10px rgba(99,255,0,.12);}
@keyframes spinGalaxy{to{transform:rotateX(68deg) rotateZ(360deg)}}
@keyframes ringPulse{50%{transform:rotateX(68deg) rotateZ(15deg) scale(1.05);opacity:.8}}
.visualizer{position:absolute;right:14%;bottom:8%;display:flex;gap:4px;align-items:end;height:32px;opacity:.45}
.visualizer i{display:block;width:3px;background:var(--green);box-shadow:0 0 8px var(--green);animation:bars .8s ease-in-out infinite alternate}
.visualizer i:nth-child(1){height:10px}.visualizer i:nth-child(2){height:24px;animation-delay:.1s}.visualizer i:nth-child(3){height:15px;animation-delay:.2s}.visualizer i:nth-child(4){height:28px;animation-delay:.3s}.visualizer i:nth-child(5){height:12px;animation-delay:.4s}.visualizer i:nth-child(6){height:22px;animation-delay:.5s}.visualizer i:nth-child(7){height:8px;animation-delay:.6s}
@keyframes bars{to{height:5px;opacity:.35}}
@media(max-width:900px){.galaxy{right:-12vw;width:55vw;height:55vw;opacity:.55}.login-card{width:min(370px,48vw)}}

@media(max-width:600px){
 body{padding:12px;justify-content:center}
 .galaxy{right:-22vw;width:85vw;height:85vw;opacity:.28}.visualizer{right:8%;bottom:4%}.login-card{width:min(92vw,360px);min-height:auto;padding:38px 24px 30px;border-radius:22px}
 .shield{width:82px;height:82px;margin-bottom:16px}
 .brand h1{font-size:40px}
 .subtitle{margin:20px auto 35px;font-size:11px;letter-spacing:3px;gap:8px}
 .subtitle:before,.subtitle:after{width:45px}
 .terminal-line{font-size:14px;margin-bottom:22px}
 .login-input{height:64px;font-size:16px;padding-left:65px}
 .login-button{height:76px;font-size:17px;letter-spacing:3px}
 .credit{margin-top:24px;font-size:10px}.credit strong{font-size:16px}
}
</style>
</head>
<body>
<div id="tech-bg" aria-hidden="true">
  <div class="circuit a"></div><div class="circuit b"></div><div class="scan"></div>
</div>

<div class="galaxy" aria-hidden="true"><div class="halo"></div><div class="ring"></div><div class="core"></div></div>
<div class="visualizer" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

<div class="login-card">
  <div class="brand">
    <div class="shield">
      <svg viewBox="0 0 100 110" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M50 5L88 18V50C88 77 72 96 50 105C28 96 12 77 12 50V18L50 5Z" stroke="currentColor" stroke-width="5"/>
        <path d="M67 33L50 25L32 34L49 43L68 34V54L50 63L32 54V70L50 80L68 70" stroke="currentColor" stroke-width="7" stroke-linecap="square"/>
      </svg>
    </div>
    <h1>SABBIR <span>CODEX</span> <span class="vps">VPS</span></h1>
    <div class="subtitle">SECURE TERMINAL v2.3</div>
  </div>

  <div class="terminal-line">
    <span class="prompt">&gt;_</span>
    <span>LOGIN_REQUIRED</span><span class="cursor"></span>
  </div>

  {% if error %}
  <div class="error-message"><i class="fas fa-triangle-exclamation"></i>{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login" id="loginForm">
    <div class="password-wrap">
      <input type="password" name="password" id="password" class="login-input"
             placeholder="Enter Access" required autofocus autocomplete="current-password">
      <i class="fas fa-eye toggle-password" onclick="togglePassword()" id="toggleIcon" aria-label="Show password"></i>
    </div>
    <button type="submit" class="login-button"><i class="fas fa-terminal"></i>AUTHENTICATE</button>
  </form>

  <div class="lock-line"><div class="lock-icon"><i class="fas fa-lock"></i></div></div>
  <div class="warning"><i class="fas fa-triangle-exclamation"></i>UNAUTHORIZED ACCESS<br>PROHIBITED</div>
  <div class="credit">POWERED BY<strong>SABBIR CODEX</strong></div>
</div>

<script>
(function(){
  const bg=document.getElementById('tech-bg');
  for(let i=0;i<42;i++){
    const n=document.createElement('span');
    n.className='node';
    n.style.left=(Math.random()*100)+'%';
    n.style.top=(Math.random()*100)+'%';
    n.style.animationDelay=(-Math.random()*5)+'s';
    n.style.animationDuration=(3+Math.random()*5)+'s';
    bg.appendChild(n);
  }
})();
function togglePassword(){
  const input=document.getElementById('password');
  const icon=document.getElementById('toggleIcon');
  if(input.type==='password'){
    input.type='text';icon.classList.remove('fa-eye');icon.classList.add('fa-eye-slash');
  }else{
    input.type='password';icon.classList.remove('fa-eye-slash');icon.classList.add('fa-eye');
  }
}
</script>
</body>
</html>
